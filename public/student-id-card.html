<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student ID Card | SomaliKing College</title>
  <meta name="description" content="Printable SomaliKing College student ID card.">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="apple-touch-icon" href="images/favicon.svg">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#0b1c3a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tailwind.css">
  <style>
    @media print {
      @page { size: 3.6in 2.3in; margin: 0.15in; }
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-primary-950">

  <div class="print:hidden container-page py-6 flex items-center justify-between">
    <a href="student-dashboard.html" class="btn-ghost">&larr; Back to Dashboard</a>
    <button type="button" id="print-btn" class="btn-primary">Print ID Card</button>
  </div>

  <main id="main-content" class="flex flex-col items-center py-6">
    <div id="auth-gate" class="hidden text-center text-slate-600 dark:text-slate-400">
      <p>You need to sign in to view your ID card.</p>
      <a href="student-portal.html" class="btn-primary mt-4 inline-flex">Go to Student Portal</a>
    </div>

    <div id="id-card" class="hidden w-[3.375in] rounded-2xl border border-primary-900/10 bg-white p-4 shadow-xl dark:bg-primary-900 print:shadow-none">
      <div class="flex items-center gap-2 border-b border-primary-100 pb-2 dark:border-primary-800">
        <img src="images/favicon.svg" alt="SKC crest" class="h-8 w-8">
        <div>
          <p class="font-display text-sm font-extrabold leading-tight text-primary-900 dark:text-white">SomaliKing College</p>
          <p class="text-[10px] uppercase tracking-widest text-gold-600 dark:text-gold-400">Student Identification</p>
        </div>
      </div>
      <div class="mt-3 flex gap-3">
        <div id="id-avatar" class="flex h-16 w-16 flex-none items-center justify-center overflow-hidden rounded-lg bg-primary-800 text-lg font-bold text-white">SK</div>
        <div class="min-w-0">
          <p id="id-name" class="truncate font-bold text-primary-900 dark:text-white">&nbsp;</p>
          <p id="id-program" class="truncate text-xs text-slate-500 dark:text-slate-400">&nbsp;</p>
          <p class="mt-1 font-mono text-xs text-primary-800 dark:text-gold-300" id="id-number">&nbsp;</p>
        </div>
      </div>
      <div class="mt-3 flex items-center justify-between border-t border-primary-100 pt-2 text-[10px] text-slate-500 dark:border-primary-800 dark:text-slate-400">
        <span>Issued: <span id="id-issued">—</span></span>
        <span>Valid until: <span id="id-valid">—</span></span>
      </div>
      <p class="mt-1 text-center text-[9px] text-slate-400">Verify at skc.college/verify &middot; <span id="id-number-2" class="font-mono"></span></p>
    </div>

    <div id="photo-upload" class="print:hidden mt-4 hidden w-[3.375in] text-center">
      <label class="btn-ghost cursor-pointer text-xs">
        Upload / Change Photo
        <input type="file" id="photo-input" accept="image/png,image/jpeg,image/webp" class="hidden">
      </label>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    (async () => {
      try {
        const res = await fetch('/api/me/id-card', { credentials: 'include' });
        if (!res.ok) throw new Error('not signed in');
        const card = await res.json();
        document.getElementById('id-name').textContent = card.full_name || '';
        document.getElementById('id-program').textContent = card.program_title ? `${card.program_title}` : 'Not yet enrolled in a program';
        document.getElementById('id-number').textContent = card.student_number || '';
        document.getElementById('id-number-2').textContent = card.student_number || '';
        const avatar = document.getElementById('id-avatar');
        if (card.photo_url) {
          avatar.innerHTML = `<img src="${card.photo_url}" alt="" class="h-full w-full object-cover">`;
        } else {
          avatar.textContent = (card.full_name || '').split(' ').map((w) => w[0]).slice(0, 2).join('').toUpperCase() || 'SK';
        }
        document.getElementById('id-issued').textContent = card.issued_at ? new Date(card.issued_at).toLocaleDateString() : '—';
        document.getElementById('id-valid').textContent = card.valid_until ? new Date(card.valid_until).toLocaleDateString() : '—';
        document.getElementById('id-card').classList.remove('hidden');
        document.getElementById('photo-upload').classList.remove('hidden');
      } catch {
        document.getElementById('auth-gate').classList.remove('hidden');
      }
    })();

    document.getElementById('print-btn').addEventListener('click', () => window.print());

    document.getElementById('photo-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const form = new FormData();
      form.append('file', file);
      try {
        const res = await fetch('/api/me/photo', { method: 'POST', credentials: 'include', body: form });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Upload failed.');
        document.getElementById('id-avatar').innerHTML = `<img src="${data.photo_url}" alt="" class="h-full w-full object-cover">`;
      } catch (err) {
        alert(err.message);
      } finally {
        e.target.value = '';
      }
    });
  </script>
</body>
</html>
